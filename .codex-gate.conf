# .codex-gate.conf — evidence commands for the external gate harness.
# Copy to repo root as .codex-gate.conf and edit. Shell syntax.
# The harness records this file's sha256 in every verdict's provenance
# footer, so changes to it are visible in gate history.
TEST_CMD="mvn verify"
# TYPECHECK slot carries the shell-suite evidence for the claude-skills package.
TYPECHECK_CMD="/bin/bash claude-skills/tests/verified-phase-tests.sh"
# LINT slot regression-checks the frozen phase-01 record with the phase validator.
LINT_CMD="claude-skills/verified-phase/scripts/validate-phase.sh docs/phases/01-verified-phase-skill --release-check"
