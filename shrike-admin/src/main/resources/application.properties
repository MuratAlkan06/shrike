# The admin facade's defaults. Every one of them is written down rather than inherited silently, so
# that changing one is a change to this file and shows up in a diff.

# Loopback only, like the broker it reads. Nothing here authenticates a caller, so nothing here is
# reachable from another machine until somebody decides it should be and says so.
server.address=127.0.0.1
server.port=8080

# How much of this machine one loopback admin facade may hold at once. Both are inherited defaults
# otherwise, and Tomcat's are 200 threads and 8192 connections: a facade whose largest answer is a
# few kilobytes would then be entitled to hundreds of megabytes of transient response buffers for
# work nobody asked it to do.
# Sixteen threads is more concurrency than three GETs a person refreshes will ever need.
server.tomcat.threads.max=16
# Sixty-four connections, the same number as the broker's own connectionCap, because the facade
# opens one connection to the broker per request it answers.
server.tomcat.max-connections=64
# How long a connection may hold one of those sixty-four places without asking anything. Tomcat's
# default is a minute, so sixty-four sockets that connect and stay silent take the whole cap and hold
# it for that minute, refreshable by whoever opened them; ten seconds is far longer than a request on
# this loopback interface takes to arrive and far shorter than a minute of nothing.
server.tomcat.connection-timeout=10s

# Where the broker listens, and how long it gets to answer. It is the whole of this facade's
# configuration: the facade holds none of the broker's state and opens none of its files, so there is
# no data directory here.
shrike.broker.host=127.0.0.1
shrike.broker.port=9750
# Five seconds, which is a describe: every question this facade asks is answered by the broker out of
# memory, so a broker that has not answered in five seconds is one that is not going to. The client
# library's own default is thirty, sized as the margin left over after a fetch has finished waiting,
# and a facade of sixteen threads against a broker that accepts connections and never answers spends
# that thirty seconds a thread. It is a client-side bound and never asks the broker for anything.
shrike.broker.read-timeout-millis=5000

# Nothing about a failure leaves this process except the sentence ErrorResponses chose. These four
# are Spring Boot's own defaults; they are pinned because the promise above is worth more than the
# lines it costs to keep it from moving underneath us.
server.error.include-message=never
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# No HTML page for a browser to be shown either. ErrorEndpoint answers /error in the same JSON shape
# as everything else, so the whitelabel page has nothing left to render; this line is what makes that
# a decision rather than a side effect.
server.error.whitelabel.enabled=false

# No web UI, no templates, and no static resources: every path this facade serves is JSON from a
# controller. With no resource handler mapped, a path nobody serves raises the exception below
# instead of falling through to the default error page, and ErrorResponses answers it in the one
# shape every other failure uses.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# DispatcherServlet writes one WARN — "No mapping for GET /whatever" — for every path nobody serves,
# before ErrorResponses is asked anything, so log volume grows with request volume and a stranger
# with a list of paths decides how much of this disk is written. ErrorResponses answers that same
# request itself, quietly and in the one shape, so pinning the framework's own line above the level
# it is written at loses nothing an operator had.
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
